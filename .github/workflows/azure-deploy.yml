name: Deploy to Azure App Service

on:
  push:
    branches:
      - main      # Change to 'master' if your default branch is master
      - develop   # Optional: deploy develop branch to staging
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

env:
  # Must match your Web App name in Azure Portal (e.g. https://repsense-api-prod.azurewebsites.net)
  AZURE_WEBAPP_NAME: repsense-api-prod
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'RepSense.API/RepSense.API/RepSense.API.csproj'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Build
      run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

    - name: Publish
      run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./publish

    - name: Create Firebase credential file (optional)
      run: |
        if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" ]; then
          echo "WARNING: FIREBASE_SERVICE_ACCOUNT_KEY not set — skipping serviceAccountKey.json (Google token verify disabled until you add the secret)."
        else
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > ./publish/serviceAccountKey.json
          echo "Firebase credential file created successfully"
          ls -la ./publish/serviceAccountKey.json
        fi
      shell: bash

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish
